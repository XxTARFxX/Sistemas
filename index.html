
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestra Galaxia ❤️</title>

    <!-- Conexión con los estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="universo">

        <!-- Estrellas del universo -->
        <div class="estrellas" id="estrellas"></div>

        <!-- Primera pantalla -->
        <main class="pantalla-inicial" id="pantallaInicial">

            <h1>Un universo para ti ❤️</h1>

            <p>
                Hay historias que ni siquiera el universo
                podría contener...
            </p>

            <button id="botonEntrar">
                Descubrir nuestro universo ✨
            </button>

        </main>

        <!-- Segunda pantalla: la galaxia -->
        <section class="viaje oculto" id="viaje">

            <div class="galaxia"></div>

            <h2>Todo universo tiene algo extraordinario...</h2>

            <p>
                Y el mío tiene una historia que quiero contarte.
            </p>

            <button id="botonContinuar">
                Continuar nuestro viaje 💜
            </button>

        </section>

        <!-- Tercera pantalla: los planetas -->
        <section class="pantalla-planetas oculto" id="pantallaPlanetas">

            <h2>Los pequeños mundos de nuestra historia 💜</h2>

            <p>
                Quiero compartir contigo algunas cosas
                que llevo en mi corazón.
            </p>

            <!-- Planetas interactivos -->
            <div class="contenedor-planetas">

                <button class="planeta" data-planeta="significado">
                    ❤️ Lo que significas para mí
                </button>

                <button class="planeta" data-planeta="recuerdos">
                    ✨ Nuestros recuerdos
                </button>

                <button class="planeta" data-planeta="futuro">
                    💜 Lo que deseo para nosotros
                </button>

            </div>

            <!-- Mensajes de los planetas -->
            <article id="mensajePlaneta" class="mensaje-planeta oculto">

                <h3 id="tituloMensaje"></h3>

                <p id="textoMensaje"></p>

                <button id="cerrarMensaje" class="boton-volver">
                    Cerrar mensaje ✨
                </button>

            </article>

            <!-- La carta completa se crea desde tu JavaScript -->

            <!-- Volver a la galaxia -->
            <button id="volverGalaxia" class="boton-volver">
                Volver a la galaxia 🌌
            </button>

        </section>

    </div>

    <!-- Conexión con JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
